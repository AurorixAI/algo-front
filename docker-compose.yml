services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AUTH_API_URL: http://localhost:8000
        NEXT_PUBLIC_EXAM_API_URL: http://localhost:8003
        NEXT_PUBLIC_DIAG_API_URL: http://localhost:8002
    container_name: algo-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_AUTH_API_URL=http://localhost:8000
      - NEXT_PUBLIC_EXAM_API_URL=http://localhost:8003
      - NEXT_PUBLIC_DIAG_API_URL=http://localhost:8002
    restart: unless-stopped
