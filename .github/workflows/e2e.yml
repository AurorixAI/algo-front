name: E2E (Playwright, local stack)

# Hermetic end-to-end tests: the workflow builds auth-service from ITS repo, starts it with Postgres and Redis
# in Docker, builds and serves THIS checkout, and drives the real UI in Chromium (see e2e/README.md).
#
# MANUAL ONLY for now: the auth-service repo (AurorixAI/auth-services) is private, so the job needs a token that
# can read it (and AurorixAI/exam-service when the exam scenario is switched on). The repository secret
# E2E_REPO_TOKEN - a fine-grained PAT with "Contents: read" on both repositories - has to be created by the
# repository owner; this workflow does not create it. Once the secret exists, add
#     pull_request:
#       branches: [develop]
# under `on:` to run the suite on every pull request to develop.
on:
  workflow_dispatch:
    inputs:
      auth_ref:
        description: "auth-service branch / tag / sha to test against (the one that is on stage)"
        required: false
        default: develop
      with_exam:
        description: "also run the online-exam scenario (checks out exam-service; its first Docker build is slow)"
        type: boolean
        required: false
        default: false
      exam_ref:
        description: "exam-service branch / tag / sha (used when with_exam is on)"
        required: false
        default: develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: The token for the private auth-service repo exists
        env:
          TOKEN: ${{ secrets.E2E_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret E2E_REPO_TOKEN is not set. It must be able to read AurorixAI/auth-services (see the header of .github/workflows/e2e.yml)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check out auth-service
        uses: actions/checkout@v4
        with:
          repository: AurorixAI/auth-services
          ref: ${{ inputs.auth_ref || 'develop' }}
          token: ${{ secrets.E2E_REPO_TOKEN }}
          path: _auth-service

      - name: Check out exam-service
        if: ${{ inputs.with_exam }}
        uses: actions/checkout@v4
        with:
          repository: AurorixAI/exam-service
          ref: ${{ inputs.exam_ref || 'develop' }}
          token: ${{ secrets.E2E_REPO_TOKEN }}
          path: _exam-service

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E (stack up -> seed per spec -> Playwright -> stack down)
        env:
          AUTH_SERVICE_PATH: ${{ github.workspace }}/_auth-service
          EXAM_SERVICE_PATH: ${{ github.workspace }}/_exam-service
          E2E_EXAM: ${{ inputs.with_exam && '1' || '' }}
        run: npm run e2e

      - name: Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
